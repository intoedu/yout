<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>윷 던지기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap">
<style>
/* 레이아웃: 초록 담요 한 화면 — 위 결과 표시, 가운데 타원 멍석(윷이 떨어지는 곳), 아래 세기 게이지·던지기 버튼, 맨 아래 기록 */
:root {
  --blanket: #1f4a33;     /* 윷 담요 */
  --blanket-deep: #143424;
  --mat: #2c6a47;         /* 멍석 안쪽 */
  --mat-edge: #3b7f58;
  --wood-flat: #ecd3a2;   /* 배(평평한 면) */
  --wood-back: #8a5a31;   /* 등(둥근 면) */
  --ink: #2b1a0c;
  --fg: #f4eedf;
  --muted: #a9c4b3;
  --hot: #d9453b;         /* 빽도·위험 구간 */
  --gold: #f2c84b;        /* 게이지·윷·모 */
  --nak: #6e7d74;         /* 낙 */
  --display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: radial-gradient(ellipse at 50% 35%, var(--blanket) 0%, var(--blanket-deep) 80%);
  background-color: var(--blanket-deep);
  color: var(--fg);
  font-family: var(--body);
  padding-inline: 16px;
  display: flex; justify-content: center;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  overflow-x: hidden;
}
.wrap {
  width: 100%; max-width: 620px;
  display: flex; flex-direction: column; align-items: center; gap: 16px;
  padding-block: 20px 28px;
}

/* 결과 */
.result { display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 104px; justify-content: center; }
.pill {
  font-family: var(--display); font-size: clamp(34px, 10vw, 52px); line-height: 1;
  padding: 12px 30px; border-radius: 14px;
  background: #2f5c43; color: var(--fg);
  box-shadow: 0 6px 16px rgba(0,0,0,.3);
}
.pill.pop { animation: pop .45s cubic-bezier(.2,1.6,.4,1); }
.pill.back { background: var(--hot); color: #fff; }
.pill.big  { background: var(--gold); color: #2a2208; }
.pill.nak  { background: var(--nak); color: #eef2ef; }
.pill.wait { background: transparent; box-shadow: none; color: var(--muted); font-size: 28px; }
.sub { font-size: 16px; color: var(--muted); min-height: 1.4em; text-align: center; }
.again {
  font-family: var(--display); font-size: 15px; color: #2a2208; background: var(--gold);
  padding: 3px 12px; border-radius: 999px; margin-left: 6px;
}
@keyframes pop { 0% { transform: scale(.4); opacity: 0 } 100% { transform: scale(1); opacity: 1 } }

/* 멍석과 윷가락 */
.field { position: relative; width: 100%; aspect-ratio: 1.35; max-width: 100%; }
.mat {
  position: absolute; left: 10%; top: 12%; width: 80%; height: 76%;
  border-radius: 50%;
  background: radial-gradient(ellipse at 50% 45%, var(--mat-edge), var(--mat) 70%);
  box-shadow: inset 0 0 0 3px rgba(255,255,255,.06), 0 10px 30px rgba(0,0,0,.25);
}
.stick {
  position: absolute; left: 35%; top: 84.25%;
  width: 30%; height: 7.5%;
  border-radius: 999px;
  box-shadow: 0 6px 10px rgba(0,0,0,.4);
  will-change: transform;
}
.stick.flat { background: linear-gradient(180deg, #d6b47b, var(--wood-flat) 40%, #f6e2bb 60%, #d6b47b); }
.stick.back { background: linear-gradient(180deg, #6a4121, var(--wood-back) 35%, #ac7a48 55%, #6f4523); }
.stick .x { display: none; position: absolute; top: 50%; transform: translateY(-50%); color: var(--ink); font-weight: bold; font-size: clamp(11px, 3vw, 16px); opacity: .8; }
.stick .x.l { left: 22%; } .stick .x.r { right: 22%; }
.stick.back .x { display: block; }
.stick .seal {
  display: none; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
  width: clamp(18px, 5vw, 26px); height: clamp(18px, 5vw, 26px); border-radius: 50%;
  border: 2px solid var(--hot); color: var(--hot);
  font-family: var(--display); font-size: clamp(10px, 2.6vw, 13px);
  place-items: center;
}
.stick.marked.flat .seal { display: grid; }
.stick.out { filter: grayscale(.6) brightness(.75); }
.stick { transition: opacity .15s; z-index: 2; }
.stick.hidden { opacity: 0; }

/* 윷을 쥔 손 */
.hand {
  position: absolute; left: 50%; bottom: 6%; width: 20%;
  transform-origin: 50% 90%;
  transform: translateX(-50%);
  z-index: 3; opacity: 0; transition: opacity .18s;
  pointer-events: none;
  filter: drop-shadow(0 8px 10px rgba(0,0,0,.35));
}
.hand.show { opacity: 1; }
.hand svg { display: block; width: 100%; height: auto; }
.hand .bundle { transition: opacity .05s; }
.hand.empty .bundle { opacity: 0; }
.hand .open { display: none; }
.hand.empty .open { display: inline; }
.hand.empty .fist { display: none; }

/* 세기 게이지 */
.power { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 6px; }
.gauge {
  position: relative; height: 18px; border-radius: 999px; overflow: hidden;
  background: rgba(0,0,0,.28);
  box-shadow: inset 0 1px 3px rgba(0,0,0,.4);
}
.gauge .strong {
  position: absolute; left: 70%; top: 0; bottom: 0; width: 22%;
  background: repeating-linear-gradient(135deg, rgba(242,200,75,.35) 0 6px, rgba(242,200,75,.15) 6px 12px);
}
.gauge .danger {
  position: absolute; right: 0; top: 0; bottom: 0; width: 8%;
  background: repeating-linear-gradient(135deg, rgba(217,69,59,.45) 0 6px, rgba(217,69,59,.25) 6px 12px);
}
.gauge .fill {
  position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
  background: var(--gold); border-radius: 999px;
}
.gauge .fill.strong { background: #f5a13a; }
.gauge .fill.hot { background: var(--hot); }
.power-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

.throw {
  width: 108px; height: 108px; border-radius: 50%;
  font-family: var(--display); font-size: 22px; color: var(--fg);
  background: radial-gradient(circle at 50% 35%, #3f9466, #2a7250);
  border: 3px solid rgba(255,255,255,.15);
  box-shadow: 0 6px 0 #184530, 0 10px 20px rgba(0,0,0,.35);
  cursor: pointer; touch-action: none;
  transition: transform .08s, box-shadow .08s;
}
.throw.pressed { transform: translateY(5px); box-shadow: 0 1px 0 #184530, 0 4px 10px rgba(0,0,0,.35); }
.throw:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }
.hint { color: var(--muted); font-size: 13px; text-align: center; line-height: 1.6; }
kbd { font-family: var(--body); border: 1px solid var(--muted); border-bottom-width: 3px; border-radius: 6px; padding: 0 7px; color: var(--fg); }

/* 차례 표시 */
.turn {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--display); font-size: 22px;
  padding: 8px 18px; border-radius: 999px;
  background: rgba(0,0,0,.25);
}
.turn .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--tc, var(--fg)); box-shadow: 0 0 0 3px rgba(255,255,255,.12); }
.turn .name { color: var(--tc, var(--fg)); }
.turn .bonus { font-size: 14px; color: #2a2208; background: var(--gold); padding: 3px 10px; border-radius: 999px; }

/* 던지기 + 잡기 버튼 줄 */
.actions { width: 100%; max-width: 420px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
.catch {
  justify-self: start;
  font-family: var(--display); font-size: 16px; line-height: 1.25; color: #2a2208;
  background: var(--gold); border: none; border-radius: 16px;
  padding: 12px 14px; cursor: pointer;
  box-shadow: 0 4px 0 #a9862a;
}
.catch small { display: block; font-family: var(--body); font-size: 12px; opacity: .8; }
.catch:active { transform: translateY(3px); box-shadow: 0 1px 0 #a9862a; }
.catch:disabled { opacity: .35; cursor: not-allowed; transform: none; box-shadow: 0 4px 0 #a9862a; }
.catch:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }

/* 팀 패널 */
.teams { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
.teams-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
.teams-head .btns { display: flex; gap: 8px; }
.tbtn { background: none; border: 1px solid #3d6b52; color: var(--fg); border-radius: 8px; padding: 6px 12px; font-family: var(--body); font-size: 13px; cursor: pointer; }
.tbtn:disabled { opacity: .4; cursor: not-allowed; }
.team {
  display: flex; flex-direction: column; gap: 8px;
  padding: 12px 14px; border-radius: 12px;
  background: rgba(0,0,0,.2);
  border: 2px solid transparent;
}
.team.now { border-color: var(--tc); background: rgba(0,0,0,.3); }
.team-top { display: flex; align-items: center; gap: 8px; }
.team-top .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--tc); flex: none; }
.team-top input {
  flex: 1; min-width: 0; background: transparent; border: none; border-bottom: 1px dashed transparent;
  color: var(--fg); font-family: var(--display); font-size: 18px; padding: 2px 0;
}
.team-top input:hover, .team-top input:focus { border-bottom-color: var(--muted); outline: none; }
.team-top .badge { font-family: var(--display); font-size: 13px; color: #10251a; background: var(--tc); padding: 3px 10px; border-radius: 999px; flex: none; }
.team-top .del { background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 0 4px; flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; min-height: 28px; align-items: center; }
.chip { font-family: var(--display); font-size: 14px; padding: 4px 10px; border-radius: 8px; background: #2f5c43; color: var(--fg); }
.chip.back { background: rgba(217,69,59,.25); color: #ff8a80; }
.chip.big  { background: rgba(242,200,75,.2); color: var(--gold); }
.chip.nak  { background: rgba(110,125,116,.35); color: #c9d3cd; }
.chip.catch-chip { background: transparent; border: 1px solid var(--gold); color: var(--gold); font-size: 12px; }
.chip.latest { outline: 2px solid var(--fg); }
.empty { color: var(--muted); font-size: 13px; }
.stats { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

@media (prefers-reduced-motion: reduce) { .pill.pop { animation: none; } }
</style>
</head>
<body>

<div class="wrap">
  <div class="turn" id="turn"><span class="dot"></span><span class="name"></span><span>차례</span></div>
  <div class="result" aria-live="polite">
    <div class="pill wait" id="pill">준비</div>
    <div class="sub" id="sub">스페이스바를 꾹 눌렀다가 떼면 던집니다</div>
  </div>

  <div class="field" id="field">
    <div class="mat"></div>
  </div>

  <div class="power">
    <div class="gauge" aria-hidden="true">
      <div class="strong"></div>
      <div class="danger"></div>
      <div class="fill" id="fill"></div>
    </div>
    <div class="power-label"><span>약하게</span><span id="pct">세기 0%</span><span>노란 구간 윷·모↑ · 끝은 낙</span></div>
  </div>

  <div class="actions">
    <span></span>
    <button class="throw" id="throw" type="button">던지기</button>
    <button class="catch" id="catch" type="button" disabled>잡았다!<small>한 번 더</small></button>
  </div>
  <div class="hint"><kbd>Space</kbd> 길게 눌러 세기 조절 → 손을 떼면 던집니다<br>노란 구간은 윷·모가 잘 나오고, 끝 빨간 구간은 무조건 낙입니다 · 처음에 화면을 한 번 클릭해 주세요</div>

  <div class="teams">
    <div class="teams-head">
      <span>팀별 기록 · 팀 이름을 눌러 바꿀 수 있습니다</span>
      <div class="btns">
        <button type="button" class="tbtn" id="addTeam">+ 팀 추가</button>
        <button type="button" class="tbtn" id="newGame">새 게임</button>
      </div>
    </div>
    <div id="teamList" style="display:flex;flex-direction:column;gap:10px"></div>
  </div>
</div>

<script>
(function () {
  const field = document.getElementById('field');
  const pill = document.getElementById('pill');
  const sub = document.getElementById('sub');
  const btn = document.getElementById('throw');
  const fill = document.getElementById('fill');
  const pct = document.getElementById('pct');
  const turnEl = document.getElementById('turn');
  const catchBtn = document.getElementById('catch');
  const teamList = document.getElementById('teamList');

  const MARKED = 3;              // 빽도 도장이 찍힌 윷가락
  const STRONG = 0.70;           // 이 세기부터 윷·모가 더 잘 나오는 구간
  const DANGER = 0.92;           // 이 세기 이상은 무조건 낙
  const NAMES = ['빽도','도','개','걸','윷','모','낙'];
  const STEPS = { '빽도':'뒤로 1칸','도':'1칸','개':'2칸','걸':'3칸','윷':'4칸','모':'5칸','낙':'멍석 밖으로 나갔습니다 · 이번 차례는 무효' };

  // 윷가락 4개 만들기
  const sticks = [0,1,2,3].map(i => {
    const s = document.createElement('div');
    s.className = 'stick ' + (i % 2 ? 'back' : 'flat') + (i === MARKED ? ' marked' : '');
    s.innerHTML = '<span class="x l">✕</span><span class="seal">빽</span><span class="x r">✕</span>';
    field.appendChild(s);
    return s;
  });
  // 처음 배치: 멍석 가운데에 흩어 두기
  // 멍석 중심 기준 필드 % 좌표 → 막대 기준 translate %
  const toStick = (fx, fy) => ({ x: fx / 30 * 100, y: (fy - 38) / 7.5 * 100 });
  const initial = [[-12,-12,-12],[10,-14,20],[-8,8,8],[13,12,-24]];
  sticks.forEach((s, i) => { const t = toStick(initial[i][0], initial[i][1]); place(s, t.x, t.y, initial[i][2]); s.classList.add('hidden'); });

  // 윷 네 가락을 쥔 손 (SVG)
  const hand = document.createElement('div');
  hand.className = 'hand show';
  hand.innerHTML = `
  <svg viewBox="0 0 120 170" aria-hidden="true">
    <g class="bundle">
      <rect x="28" y="4" width="15" height="120" rx="7.5" fill="#ecd3a2"/>
      <rect x="44" y="0" width="15" height="120" rx="7.5" fill="#8a5a31"/>
      <rect x="60" y="2" width="15" height="120" rx="7.5" fill="#ecd3a2"/>
      <rect x="76" y="6" width="15" height="120" rx="7.5" fill="#8a5a31"/>
      <text x="51.5" y="40" font-size="10" text-anchor="middle" fill="#2b1a0c">✕</text>
      <text x="83.5" y="46" font-size="10" text-anchor="middle" fill="#2b1a0c">✕</text>
    </g>
    <rect x="30" y="140" width="62" height="30" fill="#e3b286"/>
    <g class="fist">
      <rect x="16" y="70" width="92" height="80" rx="26" fill="#f0c49a" stroke="#b07a50" stroke-width="2"/>
      <path d="M22 92 Q62 84 104 92" fill="none" stroke="#c28a5e" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M22 110 Q62 102 104 110" fill="none" stroke="#c28a5e" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M22 128 Q62 120 104 128" fill="none" stroke="#c28a5e" stroke-width="2.5" stroke-linecap="round"/>
      <ellipse cx="22" cy="100" rx="14" ry="26" transform="rotate(-18 22 100)" fill="#f5cda6" stroke="#b07a50" stroke-width="2"/>
    </g>
    <g class="open" fill="#f0c49a" stroke="#b07a50" stroke-width="2">
      <rect x="27" y="36" width="17" height="70" rx="8.5" transform="rotate(-14 35 100)"/>
      <rect x="45" y="22" width="17" height="80" rx="8.5" transform="rotate(-4 53 100)"/>
      <rect x="63" y="28" width="17" height="76" rx="8.5" transform="rotate(6 71 100)"/>
      <rect x="80" y="46" width="15" height="60" rx="7.5" transform="rotate(16 87 100)"/>
      <ellipse cx="14" cy="106" rx="11" ry="28" transform="rotate(-48 14 106)"/>
      <rect x="22" y="84" width="80" height="64" rx="24"/>
      <path d="M40 112 Q60 122 84 110" fill="none" stroke="#c28a5e" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </svg>`;
  field.appendChild(hand);
  let onMat = false;

  function place(s, dx, dy, rot) {
    s.style.transform = `translate(${dx}%, ${dy}%) rotate(${rot}deg)`;
  }
  const rnd = () => crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296;

  // ── 세기 게이지 ──
  let charging = false, busy = false, startT = 0, power = 0, raf = 0;
  const CYCLE = 250;  // 0→100% 걸리는 시간(ms)

  function startCharge() {
    if (charging || busy) return;
    charging = true; startT = performance.now();
    btn.classList.add('pressed');
    if (onMat) { sticks.forEach(s => s.classList.add('hidden')); onMat = false; }
    hand.getAnimations().forEach(a => a.cancel());
    hand.classList.remove('empty'); hand.classList.add('show');
    pill.className = 'pill wait'; pill.textContent = teams[turn].name + ' 던지는 중';
    sub.textContent = '원하는 세기에서 손을 떼세요';
    tick();
  }
  function tick() {
    const t = ((performance.now() - startT) % (CYCLE * 2)) / CYCLE; // 0~2
    power = t <= 1 ? t : 2 - t;                                        // 올라갔다 내려옴
    fill.style.width = (power * 100).toFixed(1) + '%';
    fill.classList.toggle('hot', power >= DANGER);
    fill.classList.toggle('strong', power >= STRONG && power < DANGER);
    pct.textContent = '세기 ' + Math.round(power * 100) + '%';
    const shake = power >= DANGER ? (Math.random() - 0.5) * 6 : 0;
    hand.style.transform = `translateX(-50%) translateY(${power * 14}%) rotate(${power * 28 + shake}deg)`;
    raf = requestAnimationFrame(tick);
  }
  function release() {
    if (!charging) return;
    charging = false; cancelAnimationFrame(raf);
    btn.classList.remove('pressed');
    const p = Math.max(power, 0.08);
    busy = true;
    const back = hand.style.transform;
    const swing = hand.animate([
      { transform: back },
      { transform: `translateX(-50%) translateY(-${10 + p * 18}%) rotate(-${20 + p * 25}deg)`, offset: 0.45 },
      { transform: `translateX(-50%) translateY(0%) rotate(-8deg)` }
    ], { duration: 320, easing: 'cubic-bezier(.3,.8,.3,1)', fill: 'forwards' });
    setTimeout(() => { hand.classList.add('empty'); throwYut(p); }, 130);
    swing.onfinish = () => { hand.classList.remove('show'); hand.style.transform = 'translateX(-50%)'; setTimeout(() => swing.cancel(), 200); };
  }

  // ── 던지기 판정 ──
  // 기본: 윷가락마다 배/등 50%, 멍석 밖으로 나갈 확률 0.8%.
  // 노란 구간(70~92%): 윷·모가 나올 확률을 추가로 올려 줌(구간 끝으로 갈수록 더 큼).
  // 빨간 구간(92% 이상): 무조건 낙.
  function throwYut(p) {
    busy = true;
    const thrower = turn;
    let flats = sticks.map(() => rnd() < 0.5);
    let outs;
    if (p >= DANGER) {
      const k = 1 + Math.floor(rnd() * 2);             // 1~2가락이 밖으로
      const idx = [0,1,2,3].sort(() => rnd() - 0.5).slice(0, k);
      outs = sticks.map((_, i) => idx.includes(i));
    } else {
      outs = sticks.map(() => rnd() < 0.008);
      if (p >= STRONG) {
        const k = (p - STRONG) / (DANGER - STRONG);    // 0~1
        const boost = 0.08 + 0.14 * k;                 // 8% → 22% 추가 기회
        if (rnd() < boost) { const up = rnd() < 0.5; flats = flats.map(() => up); }
      }
    }
    const nak = outs.some(Boolean);
    let result;
    if (nak) result = '낙';
    else {
      const n = flats.filter(Boolean).length;
      result = n === 0 ? '모' : n === 1 ? (flats[MARKED] ? '빽도' : '도') : n === 2 ? '개' : n === 3 ? '걸' : '윷';
    }

    // 떨어질 위치: 세기가 셀수록 넓게 흩어짐. 멍석(타원) 반지름 기준 %.
    const spread = 0.25 + 0.6 * Math.min(p, 1);
    const spots = [];
    sticks.forEach((s, i) => {
      let best = null;
      for (let tries = 0; tries < 30; tries++) {
        const a = rnd() * Math.PI * 2;
        const r = outs[i] ? 1.12 + rnd() * 0.12 : Math.sqrt(rnd()) * spread;
        // 필드 좌표(% of 막대 크기): 멍석 반지름 가로 40%·세로 38%를 막대 크기 기준으로 환산
        const { x, y } = toStick(Math.cos(a) * r * 40, Math.sin(a) * r * 38);
        const cand = { x, y, rot: rnd() * 180 - 90 };
        const ok = spots.every(o => Math.hypot((o.x - x) * 0.3, (o.y - y) * 0.075) > 9);
        best = cand; if (ok) break;
      }
      spots.push(best);
    });

    const dur = 650 + p * 550;
    const lift = 18 + p * 42;       // 공중에 뜨는 높이(필드 % 기준)
    pill.className = 'pill wait'; pill.textContent = '…'; sub.textContent = '';

    sticks.forEach((s, i) => {
      const sp = spots[i];
      const spin = (rnd() < 0.5 ? -1 : 1) * (360 + p * 900 * rnd());
      const midY = sp.y / 2 - lift / 7.5 * 100;
      const kf = [
        { transform: `translate(${(rnd()-0.5)*20}%, -${180 + rnd()*40}%) rotate(${80 + rnd()*20}deg) scale(.75)` },
        { transform: `translate(${sp.x/2}%, ${midY}%) rotate(${spin/2}deg) scale(${1.15 + p*0.35})`, offset: 0.5 },
        { transform: `translate(${sp.x}%, ${sp.y}%) rotate(${sp.rot + spin}deg) scale(1)`, offset: 0.9 },
        { transform: `translate(${sp.x}%, ${sp.y}%) rotate(${sp.rot}deg) scale(1)` }
      ];
      s.classList.remove('out', 'hidden');
      const anim = s.animate(kf, { duration: dur, easing: 'cubic-bezier(.25,.6,.35,1)', fill: 'forwards' });
      setTimeout(() => {
        s.classList.toggle('flat', flats[i]);
        s.classList.toggle('back', !flats[i]);
      }, dur * 0.45);
      anim.onfinish = () => {
        place(s, sp.x, sp.y, sp.rot);
        anim.cancel();
        if (outs[i]) s.classList.add('out');
      };
    });

    setTimeout(() => {
      const tm = teams[thrower];
      pill.textContent = result;
      pill.className = 'pill pop' + (result === '빽도' ? ' back' : '') + (result === '윷' || result === '모' ? ' big' : '') + (result === '낙' ? ' nak' : '');
      const bonus = result === '윷' || result === '모';
      sub.innerHTML = `<b style="color:${tm.color}">${esc(tm.name)}</b> · ` + STEPS[result] + (bonus ? '<span class="again">한 번 더!</span>' : '');
      tm.log.push(result); onMat = true;
      afterThrow(thrower, bonus);
      fill.style.width = '0%'; fill.classList.remove('hot'); pct.textContent = '세기 ' + Math.round(p * 100) + '% 로 던짐';
      busy = false;
    }, dur + 30);
  }

  // ── 팀과 차례 ──
  const COLORS = ['#5aa9f5','#ef6a5f','#f2c84b','#b58cf0','#5fd39a','#f59a4a','#6fd6e0','#f07ab8'];
  const DEFAULT_NAMES = ['청팀','홍팀','황팀','보라팀','초록팀','주황팀','하늘팀','분홍팀'];
  const MAX_TEAMS = 8;
  let teams = [];
  teams.push(newTeam(0)); teams.push(newTeam(1));
  let turn = 0;            // 지금 던질 팀
  let lastThrower = null;  // 직전에 던진 팀
  let turnPassed = false;  // 직전 던지기 뒤 차례가 넘어갔는지
  let extra = 0;           // 지금 팀에게 남은 추가 던지기(잡기로 얻은 것)

  function newTeam(i) {
    const used = new Set(teams.map(t => t.color));
    const color = COLORS.find(c => !used.has(c)) || COLORS[i % COLORS.length];
    const name = DEFAULT_NAMES[COLORS.indexOf(color)] || ('팀 ' + (i + 1));
    return { name, color, log: [] };
  }
  const esc = t => t.replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

  function afterThrow(thrower, bonus) {
    lastThrower = thrower;
    if (bonus) { turnPassed = false; }                       // 윷·모: 한 번 더
    else if (extra > 0) { extra--; turnPassed = false; }     // 잡기로 얻은 추가 던지기 사용
    else { turn = (thrower + 1) % teams.length; turnPassed = true; }
    renderTeams();
  }

  // 잡았다 → 직전에 던진 팀이 한 번 더
  catchBtn.addEventListener('click', () => {
    if (lastThrower === null || busy || charging) return;
    const t = teams[lastThrower];
    t.log.push('잡기');
    if (turnPassed) { turn = lastThrower; turnPassed = false; }
    else extra++;
    pill.className = 'pill pop big'; pill.textContent = '잡았다!';
    sub.innerHTML = `<b style="color:${t.color}">${esc(t.name)}</b> 한 번 더 던집니다`;
    renderTeams();
  });

  function cls(r) { return r === '빽도' ? ' back' : (r === '윷' || r === '모') ? ' big' : r === '낙' ? ' nak' : r === '잡기' ? ' catch-chip' : ''; }
  function renderTeams() {
    const cur = teams[turn];
    turnEl.style.setProperty('--tc', cur.color);
    const owed = (lastThrower === turn && !turnPassed && teams[turn].log.length) ? '<span class="bonus">한 번 더</span>' : '';
    turnEl.innerHTML = `<span class="dot"></span><span class="name">${esc(cur.name)}</span><span>차례</span>${owed}`;
    catchBtn.disabled = lastThrower === null;
    catchBtn.querySelector('small').textContent = lastThrower === null ? '한 번 더' : teams[lastThrower].name + ' 한 번 더';

    teamList.innerHTML = teams.map((t, i) => {
      const shots = t.log.filter(r => r !== '잡기');
      const recent = t.log.slice(-20);
      const chips = recent.length
        ? recent.map((r, j) => `<span class="chip${cls(r)}${j === recent.length - 1 && i === lastThrower ? ' latest' : ''}">${r}</span>`).join('')
        : '<span class="empty">아직 던지지 않았습니다</span>';
      const cnt = n => shots.filter(r => r === n).length;
      const stats = shots.length
        ? `<span>${shots.length}번 던짐</span>` + NAMES.filter(n => cnt(n)).map(n => `<span>${n} ${cnt(n)}</span>`).join('') + (t.log.length - shots.length ? `<span>잡기 ${t.log.length - shots.length}</span>` : '')
        : '';
      return `<div class="team${i === turn ? ' now' : ''}" style="--tc:${t.color}">
        <div class="team-top">
          <span class="dot"></span>
          <input id="team-name-${i}" data-i="${i}" value="${esc(t.name)}" maxlength="12" aria-label="팀 이름">
          ${i === turn ? '<span class="badge">차례</span>' : ''}
          ${teams.length > 2 ? `<button type="button" class="del" data-del="${i}" aria-label="${esc(t.name)} 삭제">×</button>` : ''}
        </div>
        <div class="chips">${chips}</div>
        ${stats ? `<div class="stats">${stats}</div>` : ''}
      </div>`;
    }).join('');
    document.getElementById('addTeam').disabled = teams.length >= MAX_TEAMS;
  }

  teamList.addEventListener('input', e => {
    const i = +e.target.dataset.i; if (Number.isNaN(i)) return;
    teams[i].name = e.target.value.trim() || ('팀 ' + (i + 1));
    if (i === turn) turnEl.querySelector('.name').textContent = teams[i].name;
  });
  teamList.addEventListener('change', () => renderTeams());
  teamList.addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
  teamList.addEventListener('click', e => {
    const d = e.target.closest('[data-del]'); if (!d || busy || charging) return;
    const i = +d.dataset.del;
    teams.splice(i, 1);
    if (turn > i || turn >= teams.length) turn = (turn > i ? turn - 1 : 0);
    if (lastThrower !== null) lastThrower = lastThrower === i ? null : (lastThrower > i ? lastThrower - 1 : lastThrower);
    extra = 0; renderTeams();
  });
  document.getElementById('addTeam').addEventListener('click', () => {
    if (teams.length >= MAX_TEAMS) return;
    teams.push(newTeam(teams.length)); renderTeams();
  });
  document.getElementById('newGame').addEventListener('click', () => {
    if (busy || charging) return;
    teams.forEach(t => t.log = []);
    turn = 0; lastThrower = null; turnPassed = false; extra = 0;
    pill.className = 'pill wait'; pill.textContent = '준비';
    sub.textContent = '스페이스바를 꾹 눌렀다가 떼면 던집니다';
    renderTeams();
  });
  renderTeams();

  // ── 입력: 스페이스바 / 버튼 길게 누르기 ──
  const typing = e => e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA');
  document.addEventListener('keydown', e => {
    if (e.code !== 'Space' && e.key !== ' ') return;
    if (typing(e)) return;
    e.preventDefault();
    if (!e.repeat) startCharge();
  });
  document.addEventListener('keyup', e => {
    if (e.code !== 'Space' && e.key !== ' ') return;
    if (typing(e)) return;
    e.preventDefault(); release();
  });
  btn.addEventListener('pointerdown', e => { e.preventDefault(); btn.setPointerCapture?.(e.pointerId); startCharge(); });
  btn.addEventListener('pointerup', release);
  btn.addEventListener('pointercancel', release);
  btn.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('blur', release);
})();
</script>
</body>
</html>
